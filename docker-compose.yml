services:
  openbackend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      OPENBACKEND_HOST: ${OPENBACKEND_HOST:-0.0.0.0}
      OPENBACKEND_PORT: ${OPENBACKEND_PORT:-8787}
      OPENBACKEND_DATA_DIR: ${OPENBACKEND_DATA_DIR:-/var/lib/openbackend}
      OPENBACKEND_CORS_ORIGINS: ${OPENBACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      OPENBACKEND_REQUIRE_AUTH: ${OPENBACKEND_REQUIRE_AUTH:-true}
      OPENBACKEND_MAX_UPLOAD_BYTES: ${OPENBACKEND_MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "8787:8787"
    volumes:
      - ./data:/var/lib/openbackend
